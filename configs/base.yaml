dataset: SAR-SSP
data_root: datasets/SAR-SSP
text_cache: assets/text_cache.pt
output_dir: outputs/sarssp
device: cuda
seed: 0
input_size: 512
model:
  hidden_dim: 256
  num_queries: 100
  decoder_layers: 9
  pixel_encoder_layers: 6
  num_heads: 8
  feedforward_dim: 2048
  point_samples: 12544
  object_threshold: 0.8
  overlap_threshold: 0.8
  lambda_sfma: 0.5
  lambda_sca: 0.5
  sfma_temperature: 0.07
  layer_decay: 0.7
  feedback_strength: 0.03
  lsfg_gamma_st: 0.1
  lsfg_gamma_integrated: 0.1
  lsfg_gamma_scattering: 0.1
  lsfg_initial_temperature: 1.0
solver:
  iterations: 7000
  batch_size: 8
  lr: 0.0001
  weight_decay: 0.05
  gradient_clip: 0.01
  amp: true
  amp_dtype: bfloat16
  schedule: constant
  checkpoint_period: 500
  eval_period: 500
  workers: 2
